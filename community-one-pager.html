<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jeffery Family Lemonade Community Poster</title>
    <meta
      name="description"
      content="Cute printable event poster for Jeffery Family Lemonade on Saturday, March 21, 2026."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./community-one-pager.css" />
  </head>
  <body>
    <main class="poster">
      <section class="top-decor">
        <div class="drink drink-left" aria-hidden="true">
          <span class="drink-straw"></span>
          <span class="drink-lemon lemon-slice-a"></span>
          <span class="drink-lemon lemon-slice-b"></span>
          <span class="drink-ice ice-a"></span>
          <span class="drink-ice ice-b"></span>
        </div>

        <div class="title-lockup">
          <p class="eyebrow">Jeffery Family</p>
          <h1>Lemonade</h1>
        </div>

        <div class="drink drink-right" aria-hidden="true">
          <span class="drink-straw"></span>
          <span class="drink-lemon lemon-slice-a"></span>
          <span class="drink-lemon lemon-slice-b"></span>
          <span class="drink-ice ice-a"></span>
          <span class="drink-ice ice-b"></span>
        </div>
      </section>

      <section class="stand-stage">
        <div class="lemon lemon-left" aria-hidden="true"></div>
        <div class="stand-wrap" aria-hidden="true">
          <div class="awning">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
          <div class="legs leg-left"></div>
          <div class="legs leg-right"></div>
          <div class="counter">
            <div class="pitcher">
              <div class="pitcher-fill"></div>
              <div class="pitcher-handle"></div>
              <div class="pitcher-lemon"></div>
            </div>
            <div class="cup cup-a"></div>
            <div class="cup cup-b"></div>
            <div class="cup cup-c"></div>
          </div>
          <div class="stand-sign">Lemonade</div>
        </div>
        <div class="lemon lemon-right" aria-hidden="true"></div>
      </section>

      <section class="details">
        <h2>Stand</h2>
        <p class="date-line">Saturday, March 21, 2026</p>
        <p class="time-line">Noon to 3:00 PM</p>
        <p class="location-line">Corner of Blackburn + Marmona, Menlo Park</p>
        <p class="menu-line">Classic Sunshine • Berry Blush • Frozen Lemonade</p>
      </section>

      <section class="bottom-band">
        <article class="map-card">
          <p class="eyebrow">Find us near Willows Market</p>
          <img
            src="./google-maps-poster-area.png"
            alt="Google Maps image showing a pin at Blackburn and Marmona near Willows Market"
          />
        </article>

        <aside class="qr-card">
          <img src="./qr-code.svg" alt="QR code for the Jeffery Family Lemonade website" />
          <p>Scan for the website, menu, and directions.</p>
        </aside>
      </section>
    </main>
  </body>
</html>
